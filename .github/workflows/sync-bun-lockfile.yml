name: Sync Bun lockfile

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  sync:
    if: github.actor != 'github-actions[bot]' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.2.15'

      - name: Regenerate lockfile
        run: bun install --lockfile-only

      - name: Commit synchronized lockfile
        run: |
          if git diff --quiet -- bun.lock; then
            echo 'bun.lock already synchronized'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add bun.lock
          git commit -m 'chore: synchronize Bun lockfile'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
