name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --no-save
      # TanStack Router generates routeTree.gen.ts during the Vite build.
      # Build first so typecheck validates newly added file-based routes too.
      - run: bun run build
      - run: bun run typecheck
      - run: npx wrangler check
