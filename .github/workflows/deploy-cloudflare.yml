name: Deploy Cloudflare Worker

# Déploiement de secours, manuel uniquement. La production est déployée par
# Cloudflare Workers Builds (intégration Git). Ce workflow échouait à chaque
# push (93/93) faute de secret CLOUDFLARE_API_TOKEN dans le repo.
on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --no-save
      - run: bun run build
      - name: Deploy Worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
